[package]
name = "tilescope-aoi-desktop"
version = "0.1.0"
description = "TileScope AOI Desktop — Tauri 2 host for the Python sidecar GUI"
authors = ["TileScope AOI"]
edition = "2021"

[lib]
name = "tilescope_aoi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
