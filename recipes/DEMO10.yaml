# Synthetic example only; no production acceptance settings.
recipe_name: DEMO10
product_id: DEMO_PRODUCT
machine_id: DEMO_MACHINE
version: 1.0.0
gpu:
  mode: cpu
  tiling: false
  display: false
  dll_path: gpu/visionflow_cuda.dll
  fallback_to_cpu: true
tile:
  mode: grid
  width: 128
  height: 128
  overlap_x: 0
  overlap_y: 0
decision:
  mode: all_detectors_must_pass
  important_detectors:
  - demo10
  max_ng_count: 0
detectors:
  demo10:
    enabled: true
    use_gpu: false
    display_name: demo10
    params:
      max_value: 255
      outer_threshold: 128
      outer_invert: false
      outer_contour_mode: list
      outer_target_width: 96
      outer_width_tolerance: 3
      outer_target_height: 80
      outer_height_tolerance: 3
      inner_adaptive_block_size: 15
      inner_adaptive_c: 2.0
      inner_invert: false
      inner_contour_mode: list
      inner_target_width: 64
      inner_width_tolerance: 3
      inner_target_height: 48
      inner_height_tolerance: 3
      max_edge_gap: 20
      roi_inset_px: 0
output:
  pixel_size_um_per_px: null
  save_overlay: true
  save_ng_tiles: true
  save_csv: true
  save_matrix_csv: true
  save_json: true
